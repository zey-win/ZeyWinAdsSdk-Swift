name: Unity to Swift AI semantic analysis

on:
  workflow_dispatch:
    inputs:
      from_commit:
        description: Optional Unity baseline override; does not update last_synced_commit
        required: false
        type: string
      model:
        description: OpenAI Responses API model
        default: gpt-5.6-terra
        required: false
        type: string
  schedule:
    # Swift-only polling compares the committed baseline to current Unity main.
    - cron: '17 * * * *'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # One group for manual and scheduled runs prevents two pipelines from entering
  # the branch/PR write stage simultaneously. Never cancel a run mid-write.
  group: unity-swift-sync-pipeline
  cancel-in-progress: false

jobs:
  semantic-report:
    name: Report Unity main semantic parity for Swift review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      trigger_type: ${{ steps.polling-context.outputs.trigger_type }}
      baseline: ${{ steps.polling-context.outputs.baseline }}
      unity_head: ${{ steps.polling-context.outputs.unity_head }}
      range: ${{ steps.polling-context.outputs.range }}
      detector_status: ${{ steps.detector-status.outputs.status }}
      pipeline_state: ${{ steps.pending-sync.outputs.state }}
      pending_sync_pr: ${{ steps.pending-sync.outputs.pr_url }}

    steps:
      - name: Checkout Swift repository
        uses: actions/checkout@v4

      - name: Clone Unity main without blobs
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --branch main \
            https://github.com/zey-win/ZeyWinAdsSDK-Unity.git \
            "$RUNNER_TEMP/ZeyWinAdsSDK-Unity"

      - name: Inspect Swift-only polling range
        id: polling-context
        shell: bash
        env:
          FROM_COMMIT: ${{ inputs.from_commit }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            trigger_type=manual
          else
            trigger_type=scheduled
          fi

          baseline="$(tr -d '[:space:]' < .sync/unity-last-synced-commit)"
          unity_head="$(git -C "$RUNNER_TEMP/ZeyWinAdsSDK-Unity" rev-parse HEAD)"
          range_from="$baseline"
          if [[ -z "$FROM_COMMIT" ]]; then
            [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'Swift baseline is not a lowercase 40-character SHA.' >&2
              exit 1
            }
            git -C "$RUNNER_TEMP/ZeyWinAdsSDK-Unity" cat-file -e "${baseline}^{commit}" 2> /dev/null || {
              echo 'Swift baseline is not available in the cloned Unity repository.' >&2
              exit 1
            }
            git -C "$RUNNER_TEMP/ZeyWinAdsSDK-Unity" merge-base --is-ancestor "$baseline" "$unity_head" || {
              echo 'Swift baseline is not an ancestor of current Unity main.' >&2
              exit 1
            }
          else
            range_from="$FROM_COMMIT"
          fi
          echo "trigger_type=$trigger_type" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "unity_head=$unity_head" >> "$GITHUB_OUTPUT"
          echo "range=${range_from}..${unity_head}" >> "$GITHUB_OUTPUT"

      - name: Generate report-only detector input
        id: detector
        continue-on-error: true
        shell: bash
        env:
          FROM_COMMIT: ${{ inputs.from_commit }}
        run: |
          set -euo pipefail
          args=(
            --unity-dir "$RUNNER_TEMP/ZeyWinAdsSDK-Unity"
            --output "$RUNNER_TEMP/unity-swift-change-report.md"
            --status-output "$RUNNER_TEMP/unity-swift-detector-status"
          )

          if [[ -n "$FROM_COMMIT" ]]; then
            args+=(--from "$FROM_COMMIT")
          fi

          bash scripts/unity_swift_change_detector.sh "${args[@]}"

      - name: Record detector status
        id: detector-status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=unavailable
          if [[ -f "$RUNNER_TEMP/unity-swift-detector-status" ]]; then
            status="$(tr -d '[:space:]' < "$RUNNER_TEMP/unity-swift-detector-status")"
          fi
          case "$status" in
            changes|no_op|bootstrap|unavailable) ;;
            *) status=unavailable ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Detect a pending verified sync PR
        id: pending-sync
        if: steps.detector.outcome == 'success' && steps.detector-status.outputs.status == 'changes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unity_head='${{ steps.polling-context.outputs.unity_head }}'
          short_sha="${unity_head:0:7}"
          sync_branch="sync/unity-${short_sha}"
          echo 'state=ready' >> "$GITHUB_OUTPUT"
          echo 'pr_url=' >> "$GITHUB_OUTPUT"

          pr_has_expected_identity() {
            local head_sha="$1" message raw_trailers raw_trailer_count parsed_trailers parsed_trailer_count
            message="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}" --jq '.commit.message')"
            # Git's parsed trailer view coalesces duplicate identical values. The
            # raw count is required before an existing PR can suppress a sync run.
            raw_trailers="$(printf '%s\n' "$message" | awk '/^Unity-Head:[[:space:]]*/ { sub(/^Unity-Head:[[:space:]]*/, ""); print }')"
            raw_trailer_count="$(printf '%s\n' "$raw_trailers" | sed '/^$/d' | wc -l | tr -d ' ')"
            parsed_trailers="$(printf '%s\n' "$message" | git interpret-trailers --parse | awk -F': ' '$1 == "Unity-Head" { print $2 }')"
            parsed_trailer_count="$(printf '%s\n' "$parsed_trailers" | sed '/^$/d' | wc -l | tr -d ' ')"
            [[ "$raw_trailer_count" == 1 && "$raw_trailers" == "$unity_head" \
              && "$parsed_trailer_count" == 1 && "$parsed_trailers" == "$unity_head" ]]
          }

          for state in open merged; do
            existing="$(gh pr list --head "$sync_branch" --base main --state "$state" --json url,headRefOid --jq '.[0]')"
            if [[ "$existing" == null || -z "$existing" ]]; then
              continue
            fi
            existing_url="$(printf '%s' "$existing" | jq -r '.url')"
            existing_head="$(printf '%s' "$existing" | jq -r '.headRefOid')"
            if pr_has_expected_identity "$existing_head"; then
              if [[ "$state" == open ]]; then
                echo 'state=pending_sync_pr' >> "$GITHUB_OUTPUT"
              else
                echo 'state=pending_baseline_pr' >> "$GITHUB_OUTPUT"
              fi
              echo "pr_url=$existing_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Existing ${state} PR ${existing_url} does not prove current Unity target identity; it will not suppress this run." >&2
          done

          if ! git ls-remote --exit-code --heads origin "refs/heads/$sync_branch" > /dev/null; then
            exit 0
          fi
          git fetch origin "refs/heads/$sync_branch:refs/remotes/origin/$sync_branch"
          if ! bash scripts/unity_swift_sync_branch_identity.sh \
            --repo-root . --ref "origin/$sync_branch" --unity-head "$unity_head"; then
            echo "Existing $sync_branch cannot be proven to belong to current Unity main; leaving normal safeguards to fail safely." >&2
            exit 0
          fi

      - name: Write detector failure report
        if: steps.detector.outcome != 'success'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/unity-swift-semantic-analysis.md" <<'EOF'
          # Unity → Swift AI semantic analysis

          ## Analysis unavailable

          The report-only detector failed before semantic analysis could begin. No
          Swift/Unity source, branch, PR, merge, or sync baseline was changed.
          Inspect the failed detector step for the underlying Git or baseline error.
          EOF

      - name: Run report-only AI semantic analysis
        id: semantic
        if: >-
          steps.detector.outcome == 'success' &&
          steps.detector-status.outputs.status == 'changes' &&
          steps.pending-sync.outputs.state == 'ready'
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail
          bash scripts/unity_swift_semantic_analysis.sh \
            --unity-dir "$RUNNER_TEMP/ZeyWinAdsSDK-Unity" \
            --detector-report "$RUNNER_TEMP/unity-swift-change-report.md" \
            --output "$RUNNER_TEMP/unity-swift-semantic-analysis.md"

      - name: Publish reports to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Unity → Swift sync reports'
            echo
            echo '## Polling context'
            echo
            echo "- Trigger: \`${{ steps.polling-context.outputs.trigger_type }}\`"
            echo "- Baseline: \`${{ steps.polling-context.outputs.baseline }}\`"
            echo "- Unity main: \`${{ steps.polling-context.outputs.unity_head }}\`"
            echo "- Range: \`${{ steps.polling-context.outputs.range }}\`"
            echo "- Detector: \`${{ steps.detector-status.outputs.status }}\`"
            echo "- Semantic: \`${{ steps.semantic.outcome == 'success' && 'ran' || 'skipped' }}\`"
            if [[ -n "${{ steps.pending-sync.outputs.pr_url }}" ]]; then
              echo "- Pending sync: ${{ steps.pending-sync.outputs.pr_url }} (${{ steps.pending-sync.outputs.state }})"
            fi
            echo
            echo '## Detector report'
            if [[ -f "$RUNNER_TEMP/unity-swift-change-report.md" ]]; then
              sed -n '1,1200p' "$RUNNER_TEMP/unity-swift-change-report.md"
            else
              echo 'Detector report was not generated.'
            fi
            echo
            echo '## AI semantic report'
            if [[ -f "$RUNNER_TEMP/unity-swift-semantic-analysis.md" ]]; then
              sed -n '1,1600p' "$RUNNER_TEMP/unity-swift-semantic-analysis.md"
            else
              echo 'AI semantic report was not generated.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload detector and AI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-swift-semantic-analysis
          path: |
            ${{ runner.temp }}/unity-swift-change-report.md
            ${{ runner.temp }}/unity-swift-semantic-analysis.md
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when analysis was unavailable
        if: always() && (steps.detector.outcome != 'success' || steps.semantic.outcome == 'failure')
        shell: bash
        run: |
          echo 'Detector or AI semantic analysis was unavailable; inspect the uploaded reports.' >&2
          exit 1

  port-plan:
    name: Generate Swift port plan from semantic report
    needs: semantic-report
    if: >-
      needs.semantic-report.result == 'success' &&
      needs.semantic-report.outputs.detector_status == 'changes' &&
      needs.semantic-report.outputs.pipeline_state == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      patch_proposal_ready: ${{ steps.patch-proposal-gate.outputs.ready }}

    steps:
      - name: Checkout Swift repository
        uses: actions/checkout@v4

      - name: Download semantic analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: unity-swift-semantic-analysis
          path: ${{ runner.temp }}/unity-swift-semantic-artifact

      - name: Generate report-only AI port plan
        id: plan
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail
          bash scripts/unity_swift_port_plan.sh \
            --semantic-report "$RUNNER_TEMP/unity-swift-semantic-artifact/unity-swift-semantic-analysis.md" \
            --markdown-output "$RUNNER_TEMP/unity-swift-port-plan.md" \
            --json-output "$RUNNER_TEMP/unity-swift-port-plan.json"

      - name: Detect ready port plan for patch proposal
        id: patch-proposal-gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/unity-swift-port-plan.json" ]] \
            && jq -e '
              .schema == "zeywin.unity-swift-port-plan"
              and .schema_version == "1.0"
              and .plan_status == "ready"
              and (.items | type == "array" and length > 0)
            ' "$RUNNER_TEMP/unity-swift-port-plan.json" > /dev/null; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish port-plan summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Unity → Swift port plan'
            echo
            if [[ -f "$RUNNER_TEMP/unity-swift-port-plan.md" ]]; then
              sed -n '1,1600p' "$RUNNER_TEMP/unity-swift-port-plan.md"
            else
              echo 'Port plan was not generated.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Markdown and JSON port plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-swift-port-plan
          path: |
            ${{ runner.temp }}/unity-swift-port-plan.md
            ${{ runner.temp }}/unity-swift-port-plan.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when port plan was unavailable
        if: always() && steps.plan.outcome == 'failure'
        shell: bash
        run: |
          echo 'Port plan generation was unavailable or malformed; inspect the uploaded plan report.' >&2
          exit 1

  patch-proposal:
    name: Generate read-only Swift patch proposal
    needs: port-plan
    if: needs.port-plan.result == 'success' && needs.port-plan.outputs.patch_proposal_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Swift repository
        uses: actions/checkout@v4

      - name: Download ready port-plan artifact
        uses: actions/download-artifact@v4
        with:
          name: unity-swift-port-plan
          path: ${{ runner.temp }}/unity-swift-port-plan-artifact

      - name: Generate read-only AI patch proposal
        id: proposal
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail
          proposal_dir="$RUNNER_TEMP/unity-swift-patch-proposal"
          mkdir -p "$proposal_dir"
          bash scripts/unity_swift_patch_proposal.sh \
            --port-plan "$RUNNER_TEMP/unity-swift-port-plan-artifact/unity-swift-port-plan.json" \
            --markdown-output "$proposal_dir/patch-proposal.md" \
            --json-output "$proposal_dir/patch-proposal.json" \
            --patch-output "$proposal_dir/proposed.patch"

      - name: Publish patch-proposal summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Unity → Swift patch proposal'
            echo
            if [[ -f "$RUNNER_TEMP/unity-swift-patch-proposal/patch-proposal.md" ]]; then
              sed -n '1,2400p' "$RUNNER_TEMP/unity-swift-patch-proposal/patch-proposal.md"
            else
              echo 'Patch proposal was not generated.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload patch-proposal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-swift-patch-proposal
          path: ${{ runner.temp }}/unity-swift-patch-proposal
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when patch proposal was unavailable
        if: always() && steps.proposal.outcome == 'failure'
        shell: bash
        run: |
          echo 'Patch proposal generation was unavailable or failed validation; inspect the uploaded artifact.' >&2
          exit 1

  sync-apply:
    name: Validate, test, and propose Unity sync PR
    needs: [port-plan, patch-proposal]
    if: needs.port-plan.result == 'success' && needs.patch-proposal.result == 'success'
    runs-on: macos-15
    # Includes a bounded wait for the normal PR-required workflow to publish the
    # same check that branch protection requires.
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout current Swift main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # A branch or PR created with github.token does not trigger pull_request
          # workflows. The sync automation token below is intentionally used only
          # for the eventual push/PR, never stored in local Git configuration.
          persist-credentials: false

      - name: Download sync input artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: unity-swift-*
          path: ${{ runner.temp }}/unity-swift-sync-input
          merge-multiple: true

      - name: Revalidate proposal without applying it
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          sync_dir="$RUNNER_TEMP/unity-swift-sync-validation"
          mkdir -p "$sync_dir"
          bash scripts/unity_swift_apply_validated_patch.sh \
            --mode validate \
            --port-plan "$RUNNER_TEMP/unity-swift-sync-input/unity-swift-port-plan.json" \
            --proposal "$RUNNER_TEMP/unity-swift-sync-input/patch-proposal.json" \
            --patch "$RUNNER_TEMP/unity-swift-sync-input/proposed.patch" \
            --report-output "$sync_dir/sync-validation-report.md" \
            --applied-patch-output "$sync_dir/applied-patch.diff" \
            --status-output "$sync_dir/status"
          echo "status=$(tr -d '[:space:]' < "$sync_dir/status")" >> "$GITHUB_OUTPUT"

      - name: Require non-recursive sync automation token
        if: steps.preflight.outputs.status == 'ready'
        shell: bash
        env:
          UNITY_SWIFT_SYNC_TOKEN: ${{ secrets.UNITY_SWIFT_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$UNITY_SWIFT_SYNC_TOKEN" ]] || {
            echo 'UNITY_SWIFT_SYNC_TOKEN is required to create a branch/PR that triggers the required PR CI workflow.' >&2
            exit 1
          }

      - name: Prepare safe sync branch from current main
        id: branch
        if: steps.preflight.outputs.status == 'ready'
        shell: bash
        run: |
          set -euo pipefail
          detector_report="$RUNNER_TEMP/unity-swift-sync-input/unity-swift-change-report.md"
          unity_head="$(sed -nE 's/.*Target:.*\(([0-9a-f]{40})\).*/\1/p' "$detector_report" | head -n 1)"
          if [[ -z "$unity_head" ]]; then
            echo 'Could not determine Unity target SHA from detector metadata.' >&2
            exit 1
          fi

          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo 'Checkout is not based on current origin/main.' >&2
            exit 1
          }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'Checkout is not clean before branch preparation.' >&2
            exit 1
          }

          short_sha="${unity_head:0:7}"
          sync_branch="sync/unity-${short_sha}"
          echo "unity_head=$unity_head" >> "$GITHUB_ENV"
          echo "sync_branch=$sync_branch" >> "$GITHUB_ENV"
          echo "branch=$sync_branch" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin "refs/heads/$sync_branch" > /dev/null; then
            git fetch origin "refs/heads/$sync_branch:refs/remotes/origin/$sync_branch"
            if bash scripts/unity_swift_sync_branch_identity.sh \
              --repo-root . \
              --ref "origin/$sync_branch" \
              --unity-head "$unity_head"; then
              echo 'state=verified_existing' >> "$GITHUB_OUTPUT"
              echo "pr_ref=origin/${sync_branch}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Existing $sync_branch does not contain an exact Unity-Head trailer for $unity_head; refusing to update it." >&2
            exit 1
          fi

          git switch -c "$sync_branch"
          echo 'state=new' >> "$GITHUB_OUTPUT"
          echo 'pr_ref=HEAD' >> "$GITHUB_ENV"

      - name: Apply revalidated patch locally
        id: apply
        if: steps.preflight.outputs.status == 'ready' && steps.branch.outputs.state == 'new'
        shell: bash
        run: |
          set -euo pipefail
          sync_dir="$RUNNER_TEMP/unity-swift-sync-validation"
          bash scripts/unity_swift_apply_validated_patch.sh \
            --mode apply \
            --port-plan "$RUNNER_TEMP/unity-swift-sync-input/unity-swift-port-plan.json" \
            --proposal "$RUNNER_TEMP/unity-swift-sync-input/patch-proposal.json" \
            --patch "$RUNNER_TEMP/unity-swift-sync-input/proposed.patch" \
            --report-output "$sync_dir/sync-validation-report.md" \
            --applied-patch-output "$sync_dir/applied-patch.diff" \
            --changed-paths-output "$sync_dir/changed-paths.txt" \
            --status-output "$sync_dir/status"

      - name: Run static validation after patch apply
        if: steps.preflight.outputs.status == 'ready' && steps.branch.outputs.state == 'new'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/unity_swift_semantic_analysis.sh
          bash -n scripts/unity_swift_port_plan.sh
          bash -n scripts/unity_swift_patch_proposal.sh
          bash -n scripts/unity_swift_apply_validated_patch.sh
          bash -n scripts/unity_swift_sync_branch_identity.sh
          bash -n scripts/test_unity_swift_sync_safeguards.sh
          bash -n scripts/test_unity_swift_polling_safeguards.sh
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/unity-swift-semantic-analysis.yml")'
          git diff --check
          bash scripts/test_unity_swift_sync_safeguards.sh
          bash scripts/test_unity_swift_polling_safeguards.sh

      - name: Select and boot an available iPhone Simulator
        if: steps.preflight.outputs.status == 'ready' && steps.branch.outputs.state == 'new'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/unity-swift-sync-validation/xcode-version.log"
          xcodebuild -scheme ZeyWinSDK -sdk iphonesimulator -showdestinations
          simulator_udid="$(xcrun simctl list devices available -j | jq -r '
            [.devices[] | .[] | select(.isAvailable == true) | select(.name | test("^iPhone"))]
            | sort_by(.name) | .[0].udid // empty
          ')"
          [[ -n "$simulator_udid" ]] || { echo 'No available iPhone Simulator was found.' >&2; exit 1; }
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Build Swift SDK for iOS Simulator
        if: steps.preflight.outputs.status == 'ready' && steps.branch.outputs.state == 'new'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build -scheme ZeyWinSDK -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/unity-swift-sync-derived-data" CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/unity-swift-sync-validation/build.log"

      - name: Run required iOS Simulator XCTest suite
        if: steps.preflight.outputs.status == 'ready' && steps.branch.outputs.state == 'new'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test -scheme ZeyWinSDK -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/unity-swift-sync-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/unity-swift-sync-validation/ZeyWinSDK-default.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/unity-swift-sync-validation/test.log"

      - name: Commit and push validated sync branch
        id: push
        if: steps.preflight.outputs.status == 'ready' && steps.branch.outputs.state == 'new'
        env:
          UNITY_SWIFT_SYNC_TOKEN: ${{ secrets.UNITY_SWIFT_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sync_dir="$RUNNER_TEMP/unity-swift-sync-validation"
          expected_paths="$sync_dir/changed-paths.txt"
          actual_paths="$sync_dir/pre-commit-changed-paths.txt"
          [[ -s "$expected_paths" ]] || { echo 'Validated apply did not provide changed paths.' >&2; exit 1; }

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | LC_ALL=C sort -u > "$actual_paths"
          cmp -s "$expected_paths" "$actual_paths" || {
            echo 'Working tree changed after validated apply; refusing to commit unexpected files.' >&2
            diff -u "$expected_paths" "$actual_paths" || true
            exit 1
          }

          changed_files=()
          while IFS= read -r file; do changed_files+=("$file"); done < "$expected_paths"
          (( ${#changed_files[@]} > 0 )) || { echo 'No validated changes to commit.' >&2; exit 1; }
          git add -- "${changed_files[@]}"
          git diff --cached --name-only | LC_ALL=C sort -u > "$sync_dir/staged-paths.txt"
          cmp -s "$expected_paths" "$sync_dir/staged-paths.txt" || {
            echo 'The staged diff does not exactly match the validated changed paths.' >&2
            exit 1
          }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Sync Unity ${unity_head:0:7} changes to Swift" \
            -m "Unity-Head: ${unity_head}"
          # Do not use github.token: pushes made with it suppress the ordinary
          # pull_request workflow. This repository secret belongs to a GitHub App
          # or bot PAT with only contents/pull-request write access.
          git push "https://x-access-token:${UNITY_SWIFT_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${sync_branch}"

      - name: Create or find sync pull request
        id: pr
        if: steps.preflight.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ secrets.UNITY_SWIFT_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$sync_branch" --base main --state open --json number,url --jq '.[0]')"
          if [[ "$existing" != "null" && -n "$existing" ]]; then
            echo "url=$(printf '%s' "$existing" | jq -r '.url')" >> "$GITHUB_OUTPUT"
            echo "number=$(printf '%s' "$existing" | jq -r '.number')" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          body="$RUNNER_TEMP/unity-swift-sync-validation/pr-body.md"
          detector_report="$RUNNER_TEMP/unity-swift-sync-input/unity-swift-change-report.md"
          unity_range="$(sed -nE 's/^- (Unity )?[Rr]ange:[[:space:]]*`?([^`]+)`?.*/\2/p' "$detector_report" | head -n 1)"
          [[ -n "$unity_range" ]] || unity_range="baseline..${unity_head} (see detector artifact)"
          {
            echo '## Unity → Swift validated sync proposal'
            echo
            echo "- Unity commit range: \`${unity_range}\`"
            echo "- Unity target: \`${unity_head}\`"
            echo '- Base: `main`'
            echo "- Branch: \`${sync_branch}\`"
            echo '- Manual review and approval are required; auto-merge is disabled.'
            echo '- `.sync/unity-last-synced-commit` must not be updated until this PR is manually merged.'
            echo
            echo '## Semantic / port-plan source item IDs'
            jq -r '.items[] | "- \(.id)"' "$RUNNER_TEMP/unity-swift-sync-input/unity-swift-port-plan.json"
            echo
            echo '## Patch-ready port-plan items'
            jq -r '.items[] | select(.patch_ready == true) | "- \(.id): " + ([.target_swift_files_symbols[]] | join(", "))' "$RUNNER_TEMP/unity-swift-sync-input/unity-swift-port-plan.json"
            echo
            echo '## Patch proposal summary and risks'
            jq -r '.items[] | "- \(.id): risk=\(.risk_level); " + (.exact_proposed_changes | join("; "))' "$RUNNER_TEMP/unity-swift-sync-input/patch-proposal.json"
            echo
            echo '## Blockers'
            jq -r '[.items[].blockers[]] | if length == 0 then "- None" else .[] | "- " + . end' "$RUNNER_TEMP/unity-swift-sync-input/unity-swift-port-plan.json"
            echo
            echo '## Changed Swift files'
            git diff --name-only origin/main..."$pr_ref" | sed 's/^/- `&`/'
            echo
            echo '## Tests executed'
            echo '- Static shell/YAML/diff validation'
            echo '- iOS Simulator build'
            echo '- Required default XCTest suite'
            echo '- Required PR check is awaited below; the PR is never auto-merged.'
          } > "$body"
          pr_url="$(gh pr create --base main --head "$sync_branch" --title "Sync Unity ${unity_head:0:7} changes to Swift" --body-file "$body")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "number=$(gh pr view "$pr_url" --json number --jq '.number')" >> "$GITHUB_OUTPUT"

      - name: Verify auto-created PR receives the required CI check
        id: pr-required-ci
        if: steps.preflight.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ secrets.UNITY_SWIFT_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          required_name='Required iOS Simulator XCTest'
          pr_number='${{ steps.pr.outputs.number }}'
          [[ -n "$pr_number" ]] || { echo 'Sync PR number was not available.' >&2; exit 1; }

          for attempt in {1..36}; do
            checks="$(gh pr checks "$pr_number" --json name,state,link 2>/dev/null || true)"
            state="$(printf '%s' "$checks" | jq -r --arg name "$required_name" '[.[] | select(.name == $name)] | last | .state // empty')"
            case "$state" in
              SUCCESS)
                echo 'state=success' >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED)
                echo "Required PR check ${required_name} completed with ${state}." >&2
                exit 1
                ;;
              *)
                echo "Waiting for required PR check ${required_name} (state=${state:-not-published})."
                sleep 20
                ;;
            esac
          done

          echo "Required PR check ${required_name} was not published within 12 minutes. This usually means the automation credential did not trigger pull_request CI." >&2
          exit 1

      - name: Publish sync summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Unity → Swift sync apply'
            echo
            if [[ -f "$RUNNER_TEMP/unity-swift-sync-validation/sync-validation-report.md" ]]; then
              cat "$RUNNER_TEMP/unity-swift-sync-validation/sync-validation-report.md"
            fi
            if [[ -n "${{ steps.pr.outputs.url }}" ]]; then
              echo
              echo "PR: ${{ steps.pr.outputs.url }}"
            fi
            if [[ -n "${{ steps.pr-required-ci.outputs.state }}" ]]; then
              echo "Required PR CI: ${{ steps.pr-required-ci.outputs.state }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-swift-sync-validation
          path: |
            ${{ runner.temp }}/unity-swift-sync-validation
          if-no-files-found: warn
          retention-days: 30

  polling-summary:
    name: Summarize Unity to Swift polling run
    needs: [semantic-report, port-plan, patch-proposal, sync-apply]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read

    steps:
      - name: Publish pipeline summary
        shell: bash
        env:
          TRIGGER_TYPE: ${{ needs.semantic-report.outputs.trigger_type }}
          BASELINE: ${{ needs.semantic-report.outputs.baseline }}
          UNITY_HEAD: ${{ needs.semantic-report.outputs.unity_head }}
          UNITY_RANGE: ${{ needs.semantic-report.outputs.range }}
          DETECTOR_STATUS: ${{ needs.semantic-report.outputs.detector_status }}
          PIPELINE_STATE: ${{ needs.semantic-report.outputs.pipeline_state }}
          PENDING_SYNC_PR: ${{ needs.semantic-report.outputs.pending_sync_pr }}
          SEMANTIC_RESULT: ${{ needs.semantic-report.result }}
          PORT_PLAN_RESULT: ${{ needs.port-plan.result }}
          PATCH_PROPOSAL_RESULT: ${{ needs.patch-proposal.result }}
          SYNC_APPLY_RESULT: ${{ needs.sync-apply.result }}
        run: |
          set -euo pipefail
          semantic_state=skipped
          [[ "$DETECTOR_STATUS" == changes && "$PIPELINE_STATE" == ready ]] && semantic_state="$SEMANTIC_RESULT"
          {
            echo '# Unity → Swift polling summary'
            echo
            echo "- Trigger: \`${TRIGGER_TYPE:-unknown}\`"
            echo "- Baseline: \`${BASELINE:-unavailable}\`"
            echo "- Unity main: \`${UNITY_HEAD:-unavailable}\`"
            echo "- Range: \`${UNITY_RANGE:-unavailable}\`"
            echo "- Detector: \`${DETECTOR_STATUS:-unavailable}\`"
            echo "- Semantic: \`${semantic_state}\`"
            echo "- Port plan: \`${PORT_PLAN_RESULT}\`"
            echo "- Patch proposal: \`${PATCH_PROPOSAL_RESULT}\`"
            echo "- Sync apply: \`${SYNC_APPLY_RESULT}\`"
            if [[ -n "$PENDING_SYNC_PR" ]]; then
              echo "- Pending sync PR: ${PENDING_SYNC_PR} (${PIPELINE_STATE})"
            else
              echo '- Pending sync PR: none'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
